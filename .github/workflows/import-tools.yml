name: Import verified StreamGather binaries
on:
  push:
    paths:
      - '.github/workflows/import-tools.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify project binaries
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_macos -o yt-dlp
          for tool in ffmpeg ffprobe; do
            curl -fLsS --retry 3 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/${tool}-darwin-arm64" -o "tools/$tool"
          done
          echo '0f922c15ccc0b83eefa1c8bc9104e434318c4bf16e408e1ee93b7745a6efe0aa  yt-dlp' | sha256sum -c -
          echo 'a90e3db6a3fd35f6074b013f948b1aa45b31c6375489d39e572bea3f18336584  tools/ffmpeg' | sha256sum -c -
          echo 'bb2db6f5d8cef919da12fbf592119a987202a8c060a886f3cab091f9cab90b64  tools/ffprobe' | sha256sum -c -
          chmod +x yt-dlp tools/ffmpeg tools/ffprobe
          git add -- yt-dlp tools/ffmpeg tools/ffprobe
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bundle verified macOS media tools'
          git push origin HEAD:main
